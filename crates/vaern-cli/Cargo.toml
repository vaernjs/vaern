[package]
name = "vaern-cli"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "Command-line interface for the Vaern agent-native JavaScript/TypeScript runtime."

[[bin]]
name = "vaern"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime entrypoint
tokio = { version = "1.44", features = ["rt", "macros"] }

# Core engine and type stripper
vaern-core = { path = "../vaern-core" }
