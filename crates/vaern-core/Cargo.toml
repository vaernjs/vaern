[package]
name = "vaern-core"
version = "0.0.3"
edition = "2024"
license = "MIT"
description = "Core execution engine and type stripper for the Vaern JavaScript/TypeScript runtime."

[dependencies]
# Error definition
thiserror = "2.0"

# Async runtime
tokio = { version = "1.44", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util", "signal"] }

# JavaScript engine
rquickjs = { version = "0.14", features = ["loader", "classes", "properties", "macro"] }

# HTTP client and TLS networking (hyper + rustls, no OpenSSL)
hyper = { version = "1.5", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "server-auto"] }
http-body-util = "0.1"
http = "1.2"
bytes = "1.10"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "webpki-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["pem", "ring"] }

# TypeScript parsing and type stripping
swc_common = "26.0"
swc_ecma_parser = "46.1"
swc_ecma_ast = "29.0"
swc_ecma_visit = "29.0"
swc_ecma_transforms_typescript = "56.0"
swc_ecma_codegen = "32.0"

[dev-dependencies]
tempfile = "3.17"

